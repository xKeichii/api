openapi: 3.1.0
info:
  title: Express TypeScript API
  version: 1.0.0
  description: >-
    API rejestracji, logowania JWT, zarządzania sesją oraz profilu użytkownika.
servers:
  - url: http://{hostname}:3000/api
    description: Lokalny serwer deweloperski
    variables:
      hostname:
        default: localhost
        description: Hostname API; dla lokalnego uruchomienia pozostaw localhost.
tags:
  - name: Authentication
    description: Rejestracja, logowanie i wylogowanie
  - name: Profile
    description: Profil zalogowanego użytkownika
paths:
  /auth/register:
    post:
      tags: [Authentication]
      operationId: register
      summary: Rejestruje użytkownika
      security: []
      description: Hasło jest przechowywane w bazie jako hash bcrypt. Rejestracja nie loguje automatycznie użytkownika.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: user@example.com
              password: BezpieczneHaslo123!
              displayName: Jan Kowalski
      responses:
        '201':
          description: Konto zostało utworzone.
          content:
            application/json:
              schema:
                type: object
                required: [message, user]
                properties:
                  message:
                    type: string
                    example: Konto zostało utworzone.
                  user:
                    $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Konto z tym adresem e-mail już istnieje.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Konto z tym adresem e-mail już istnieje.
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Loguje użytkownika
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: user@example.com
              password: BezpieczneHaslo123!
      responses:
        '200':
          description: Zalogowano. Token JWT należy przesyłać w nagłówku Authorization.
          content:
            application/json:
              schema:
                type: object
                required: [token, expiresAt, user]
                properties:
                  token:
                    type: string
                    description: Token JWT podpisany algorytmem HS256.
                  expiresAt:
                    type: string
                    format: date-time
                    description: Czas wygaśnięcia tokenu w UTC.
                  user:
                    $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Nieprawidłowy adres e-mail lub hasło.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Nieprawidłowy adres e-mail lub hasło.
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Unieważnia bieżącą sesję
      description: Usuwa sesję z bazy. Token nie będzie akceptowany po wylogowaniu.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Wylogowano pomyślnie.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
                    example: Wylogowano pomyślnie.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/me:
    get:
      tags: [Profile]
      operationId: getCurrentUser
      summary: Pobiera profil zalogowanego użytkownika
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profil użytkownika.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Nie znaleziono użytkownika.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags: [Profile]
      operationId: updateCurrentUser
      summary: Aktualizuje nazwę wyświetlaną i/lub opis
      description: >-
        Prześlij co najmniej jedno z pól displayName lub bio. Nieznane pola,
        w tym email, są odrzucane. Puste body również zwraca błąd walidacji.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
            examples:
              bothFields:
                summary: Zmiana nazwy i opisu
                value:
                  displayName: Jan Kowalski
                  bio: Lubię podróże i kawę.
              bioOnly:
                summary: Zmiana samego opisu
                value:
                  bio: Lubię podróże i kawę.
      responses:
        '200':
          description: Zaktualizowany profil.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Nie znaleziono użytkownika.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token zwrócony przez POST /auth/login.
  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, displayName]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Adres jest przyjmowany bez spacji brzegowych i zapisywany małymi literami.
        password:
          type: string
          minLength: 8
          maxLength: 72
          description: Od 8 do 72 bajtów UTF-8.
        displayName:
          type: string
          minLength: 1
          maxLength: 80
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 72
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        bio:
          type: string
          maxLength: 280
    UserProfile:
      type: object
      required: [id, email, displayName, bio]
      properties:
        id:
          type: string
          description: Identyfikator użytkownika zwracany jako tekst.
          example: '42'
        email:
          type: string
          format: email
          readOnly: true
          example: user@example.com
        displayName:
          type: string
          maxLength: 80
          example: Jan Kowalski
        bio:
          type: string
          maxLength: 280
          example: Lubię podróże i kawę.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    ValidationError:
      description: Błąd walidacji zawiera details; niepoprawny JSON zwraca tylko error.
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: Nieprawidłowe dane.
        details:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
                description: Ścieżka błędnego pola; pusty tekst oznacza błąd całego body.
              message:
                type: string
  responses:
    ValidationError:
      description: Błędne dane wejściowe lub niepoprawny JSON.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          examples:
            invalidFields:
              value:
                error: Nieprawidłowe dane.
                details:
                  - field: email
                    message: Podaj poprawny adres e-mail.
            malformedJson:
              value:
                error: Nieprawidłowy format JSON.
    Unauthorized:
      description: Brak, niepoprawny, wygasły lub unieważniony token Bearer.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missingToken:
              value:
                error: Wymagany jest token Bearer.
            invalidToken:
              value:
                error: Token jest nieprawidłowy lub wygasł.
            revokedSession:
              value:
                error: Sesja wygasła lub została wylogowana.
    ServerError:
      description: Nieoczekiwany błąd serwera, np. problem z bazą danych.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Wystąpił nieoczekiwany błąd serwera.