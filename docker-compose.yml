services:
  api:
    build:
      context: .
    restart: unless-stopped
    environment:
      PORT: ${PORT:-8080}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.local}
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: ${DB_USER:?Set DB_USER in .env.local}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.local}
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env.local}
      SEED_USER_1_EMAIL: ${SEED_USER_1_EMAIL:-demo1@example.com}
      SEED_USER_1_PASSWORD: ${SEED_USER_1_PASSWORD:-DemoUser1!2026}
      SEED_USER_1_DISPLAY_NAME: ${SEED_USER_1_DISPLAY_NAME:-Demo User 1}
      SEED_USER_2_EMAIL: ${SEED_USER_2_EMAIL:-demo2@example.com}
      SEED_USER_2_PASSWORD: ${SEED_USER_2_PASSWORD:-DemoUser2!2026}
      SEED_USER_2_DISPLAY_NAME: ${SEED_USER_2_DISPLAY_NAME:-Demo User 2}
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    depends_on:
      mariadb:
        condition: service_healthy

  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:?Set DB_NAME in .env.local}
      MARIADB_USER: ${DB_USER:?Set DB_USER in .env.local}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.local}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env.local}
    ports:
      - "${DB_LOCAL_PORT:-3307}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  mariadb_data: